name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build signed Android APK
        run: gradle --no-daemon -p clients/android assembleRelease
      - name: Stage APK
        run: |
          mkdir -p release-assets
          cp clients/android/app/build/outputs/apk/release/app-release.apk release-assets/BlackJack-1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/BlackJack-1.0.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: clients/desktop
        run: npm ci
      - name: Test server address validation
        working-directory: clients/desktop
        run: npm test
      - name: Build portable Windows client
        working-directory: clients/desktop
        run: npm run dist:win
      - name: Stage Windows client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $exe = Get-ChildItem clients/desktop/dist -Filter *.exe -File | Select-Object -First 1
          if ($null -eq $exe) { throw "Windows executable was not produced" }
          Copy-Item $exe.FullName release-assets/BlackJack-1.0.exe
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/BlackJack-1.0.exe
          if-no-files-found: error

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: clients/desktop
        run: npm ci
      - name: Test server address validation
        working-directory: clients/desktop
        run: npm test
      - name: Build Linux desktop client
        working-directory: clients/desktop
        run: npm run dist:linux
      - name: Install Flatpak tooling and runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Build Flatpak bundle
        run: |
          mkdir -p clients/flatpak/build-input release-assets
          cp -a clients/desktop/dist/linux-unpacked/. clients/flatpak/build-input/
          cp clients/flatpak/blackjack-launcher.sh clients/flatpak/build-input/
          cp clients/flatpak/online.bcull.blackjack.desktop clients/flatpak/build-input/
          cp clients/flatpak/blackjack.svg clients/flatpak/build-input/
          flatpak-builder --user --force-clean --repo=clients/flatpak/repo \
            clients/flatpak/build-dir clients/flatpak/online.bcull.blackjack.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            clients/flatpak/repo release-assets/BlackJack-1.0.flatpak online.bcull.blackjack
      - uses: actions/upload-artifact@v4
        with:
          name: release-flatpak
          path: release-assets/BlackJack-1.0.flatpak
          if-no-files-found: error

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package server installation
        run: |
          mkdir -p release-assets/BlackJack-Server-1.0
          cp README.md .env.example .dockerignore Dockerfile requirements.txt \
            app.py account.py blackjack.py client.js index.html styles.css \
            docker-compose.yml docker-compose.tunnel.yml release-assets/BlackJack-Server-1.0/
          cp -R assets release-assets/BlackJack-Server-1.0/
          cd release-assets
          zip -rq BlackJack-Server-1.0.zip BlackJack-Server-1.0
      - uses: actions/upload-artifact@v4
        with:
          name: release-server
          path: release-assets/BlackJack-Server-1.0.zip
          if-no-files-found: error

  publish:
    needs: [android, windows, flatpak, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: BlackJack 1.0
          generate_release_notes: true
          body: |
            BlackJack 1.0 clients ask for a server address and default to https://blackjack.bcull.online.

            - Android: install the APK directly; it is signed with the CI debug key for sideload testing.
            - Windows: portable x64 executable.
            - Linux: Flatpak bundle; Flatpak may install the Freedesktop runtime if it is not already installed.
            - Server: Docker/CasaOS install archive with setup instructions in README.md.
          files: release-assets/*
          fail_on_unmatched_files: true
