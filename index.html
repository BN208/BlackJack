<!DOCTYPE html>
<html>
    <head>
        <title>BlackJack</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="assets/cards/IndividualCards/AS.png"/>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap">
        <script src="client.js" defer></script>
        <link rel="stylesheet" href="styles.css"/>
    </head>
    <body class="body">
        <div class="navbar">
            <div class="nav-links">
                <div class="dropdown">
                    <button class="button" id="signin">Sign In</button>
                    <div class="dropdown-menu" id="signin-dropdown">
                        <form id="login-form">
                            <button class="button" type="button" id="signup">No Account? Sign Up!</button>
                            <input type="text" class="txtIn" id="username" placeholder="Username" required />
                            <input type="password" class="txtIn" id="password" placeholder="Password" required />
                            <button type="submit" class="button" id="login2">Log In</button>
                        </form>
                    </div>
                </div>
                <span class="nav-brand">BlackJack</span>
            </div>
            <div class="nav-links">
                <div class="dropdown">
                    <button class="button" id="startBtn">Start Game!</button>
                    <div class="dropdown-menu dropdown-right" id="start-dropdown">
                        <div id="game-menu">
                            <button type="button" class="button" id="create-game-btn">New Game</button>
                            <hr class="menu-divider" />
                            <form id="join-form">
                                <input type="text" class="txtIn" id="game-code-input" placeholder="Enter Game Code" maxlength="6" required />
                                <button type="submit" class="button" id="join-game-btn">Join Game</button>
                            </form>
                        </div>
                    </div>
                </div>
                <span id="balance">balance: £---</span>
                <button type="button" class="button small-btn" id="admin-console-btn" style="display: none;">Admin</button>
            </div>
        </div>

        <div id="admin-console" class="admin-console" style="display: none;" aria-label="Admin console">
            <div class="admin-console-header">
                <h2>Admin Console</h2>
                <button type="button" class="button small-btn" id="admin-console-close">Close</button>
            </div>
            <div class="admin-signups-controls">
                <div id="admin-signups-state" class="admin-signups-state"></div>
                <button type="button" class="button small-btn" id="admin-signups-toggle">Enable Signups</button>
            </div>
            <div class="admin-table-wrap">
                <table id="admin-table">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Balance</th>
                            <th>Admin</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body"></tbody>
                </table>
            </div>
        </div>

        <!-- LANDING PAGE VIEW -->
        <div id="home-view">
            <h1 class="title">BlackJack</h1>
            <div id="mainimagediv">
                <img class="mainimage" src="assets/cards/IndividualCards/AS.png"/>
                <img class="mainimage" src="assets/cards/IndividualCards/KH.png"/>
            </div>
            <p id="tagline">
                BlackJack - Made by Ben (it's shite)
            </p>
            <div id="leaderboard">
                <h2 id="lbtext">LeaderBoard: Top 10</h2>
                <table id="lbtable">
                    <thead>
                        <tr>
                            <th id="lbtableRank">Rank</th>
                            <th>Username</th>
                            <th>Money</th>
                        </tr>
                    </thead>
                    <tbody id="lb-body"></tbody>
                </table>
            </div>
        </div>

        <!-- GAME ROOM VIEW -->
        <div id="game-view" style="display: none;">
            <div id="game-arena">
                <!-- Top-Left Room Info & Max Players -->
                <div id="room-badge">
                    <div class="badge-row">
                        <span>Code: <strong id="room-code-display">-----</strong></span>
                        <span id="player-count-display">(1/5 Max)</span>
                        <button type="button" class="button small-btn" id="leave-room-btn">Leave</button>
                    </div>
                    <div class="shoe-info" id="shoe-info">6-Deck Shoe: 312 cards left</div>
                </div>

                <!-- Center Status Banner -->
                <div id="game-status-banner">Place your bets!</div>

                <!-- Automated Server-Side Dealer (Top Center) -->
                <div class="seat dealer-seat" id="dealer-seat">
                    <div class="seat-label" id="dealer-label">Dealer</div>
                    <div class="card-hand" id="dealer-cards"></div>
                </div>

                <!-- Dynamic Player Seats (Hidden when empty, repositioned via JS) -->
                <div class="seat player-seat" id="seat-0" style="display: none;">
                    <div class="seat-label" id="seat-0-name"></div>
                    <div class="card-hand" id="seat-0-cards"></div>
                    <div class="seat-sub" id="seat-0-info"></div>
                </div>

                <div class="seat player-seat" id="seat-1" style="display: none;">
                    <div class="seat-label" id="seat-1-name"></div>
                    <div class="card-hand" id="seat-1-cards"></div>
                    <div class="seat-sub" id="seat-1-info"></div>
                </div>

                <div class="seat player-seat" id="seat-2" style="display: none;">
                    <div class="seat-label" id="seat-2-name"></div>
                    <div class="card-hand" id="seat-2-cards"></div>
                    <div class="seat-sub" id="seat-2-info"></div>
                </div>

                <div class="seat player-seat" id="seat-3" style="display: none;">
                    <div class="seat-label" id="seat-3-name"></div>
                    <div class="card-hand" id="seat-3-cards"></div>
                    <div class="seat-sub" id="seat-3-info"></div>
                </div>

                <div class="seat player-seat" id="seat-4" style="display: none;">
                    <div class="seat-label" id="seat-4-name"></div>
                    <div class="card-hand" id="seat-4-cards"></div>
                    <div class="seat-sub" id="seat-4-info"></div>
                </div>

                <!-- Bottom Action Controls -->
                <div id="player-controls">
                    <div id="bet-controls">
                        <input type="number" class="txtIn" id="bet-input" placeholder="Bet (£)" min="1" value="10" />
                        <button type="button" class="button" id="bet-btn">Place Bet</button>
                    </div>
                    <div id="action-controls" style="display: none;">
                        <button type="button" class="button" id="twist-btn">Twist</button>
                        <button type="button" class="button" id="stick-btn">Stick</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
