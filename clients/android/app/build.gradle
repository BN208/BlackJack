plugins {
    id 'com.android.application'
}

android {
    namespace 'online.bcull.blackjack'
    compileSdk 35

    defaultConfig {
        applicationId 'online.bcull.blackjack'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
